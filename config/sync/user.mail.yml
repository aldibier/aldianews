cancel_confirm:
  body: "<img src=\"[site:url]themes/custom/al_dia_news/src/img/banner1.png\">\r\n\r\n<div> \r\n[user:display-name],\r\n\r\nA request to cancel your account has been made at [site:name].\r\n\r\nYou may now cancel your account on [site:url-brief] by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:cancel-url]\r\n\r\nNOTE: The cancellation of your account is not reversible.\r\n\r\nThis link expires in one day and nothing will happen if it is not used.\r\n\r\n--  [site:name] team\r\n</div>"
  subject: 'Account cancellation request for [user:display-name] at [site:name]'
password_reset:
  body: "<img src=\"[site:url]themes/custom/al_dia_news/src/img/banner1.png\">\r\n\r\n<div> \r\n[user:display-name],\r\n\r\nA request to reset the password for your account has been made at [site:name].\r\n\r\nYou may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nNOTE: The cancellation of your account is not reversible.\r\n\r\nThis link expires after one day and nothing will happen if it’s not used.\r\n\r\n--  [site:name] team\r\n</div>"
  subject: 'Replacement login information for [user:display-name] at [site:name]'
register_admin_created:
  body: "[user:display-name],\r\n\r\nA site administrator at [site:name] has created an account for you. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
  subject: 'An administrator created an account for you at [site:name]'
register_no_approval_required:
  body: "[user:display-name],\r\n\r\n<img src=\"[site:url]themes/custom/al_dia_news/src/img/register1.png\">\r\n\r\n<h2>WE ARE GLAD YOU HAVE DECIDED TO JOIN THIS LATINX AMERICAN FAMILY.</h2>\r\n \r\n<div> \r\nYou just need to take one more step: Please, click the button below to confirm your new Account.\r\n\r\nOtherwise, if you did not fill the registration form for creating an Account, you can pass over this email.\r\n\r\n\r\nWe welcome you to the best of the American Latino Experience.\r\n\r\nBest Regards,\r\n</div>\r\n<div class=\"text-red\">\r\n  Martín Alfaro\r\n</div>\r\n<div>\r\n Bussiness Development Manager,\r\n</div>\r\nThank you for registering at [site:name]. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
  subject: 'Account details for [user:display-name] at [site:name]'
register_pending_approval:
  body: "[user:display-name],\r\n\r\n<img src=\"[site:url]themes/custom/al_dia_news/src/img/register1.png\">\r\n\r\n<h2>WE ARE GLAD YOU HAVE DECIDED TO JOIN THIS LATINX AMERICAN FAMILY.</h2>\r\n\r\nYou just need to take one more step: Please, click the button below to confirm your new Account.\r\n\r\nOtherwise, if you did not fill the registration form for creating an Account, you can pass over this email.\r\n\r\n\r\nWe welcome you to the best of the American Latino Experience.\r\n\r\nBest Regards,\r\n\r\nMartín Alfaro\r\nBussiness Development Manager,\r\n<img src=\"[site:url]themes/custom/al_dia_news/src/img/logo.png\">\r\n\r\n\r\nThank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.\r\n\r\n--  [site:name] team"
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
register_pending_approval_admin:
  body: "[user:display-name] has applied for an account.\r\n\r\n[user:edit-url]"
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
status_activated:
  body: "[user:display-name],\r\n\r\nYour account at [site:name] has been activated.\r\n\r\nYou will be able to log in to [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: your password.\r\n\r\n-- [site:name] team"
  subject: 'Account details for [user:display-name] at [site:name]'
status_blocked:
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\n--  [site:name] team"
  subject: 'Account details for [user:display-name] at [site:name] (blocked)'
status_canceled:
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
  subject: 'Account details for [user:display-name] at [site:name] (canceled)'
