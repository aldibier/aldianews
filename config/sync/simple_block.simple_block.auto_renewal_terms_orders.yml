id: auto_renewal_terms_orders
title: 'Auto-Renewal terms Orders Simple Block'
content:
  value: "<p>AUTO-RENEWAL TERMS&nbsp;<br />\r\nYour subscription term is detailed in your order summary above. You will be charged the amount for your initial term today. At the end of each subcription period, your subcription will automatically renew and you will be charged at the then prevailing rate for each subscription period.&nbsp;<br />\r\nThe date of your renewal payment will be confirmed in your welcome email. If there are any changes to the amount and frecuency of your payment, AL DÍA News will notify you at least two weeks in advance of payment being taken. You may cancel at any time by emailing your local costumer service centre. Please allow up to three weeks for your cancellation to be processed.</p>\r\n"
  format: full_html
