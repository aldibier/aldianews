elements: "fieldset:\n  '#type': container\n  '#title': Container\n  '#title_display': invisible\n  '#description_display': invisible\n  markup:\n    '#type': webform_markup\n    '#markup': 'YOUR INFORMATION'\n  first_name:\n    '#type': textfield\n    '#title': 'First name'\n    '#required': true\n  last_name:\n    '#type': textfield\n    '#title': 'Last name'\n    '#required': true\n  email:\n    '#type': email\n    '#title': Email\n    '#required': true\nnominee_information:\n  '#type': label\n  '#title': 'Nominee information'\n  '#description': 'NOMINEE INFORMATION'\nfirst_name_nominee:\n  '#type': textfield\n  '#title': 'First name'\n  '#required': true\nlast_name_nominee:\n  '#type': textfield\n  '#title': 'Last name'\n  '#required': true\nemail_nominee:\n  '#type': email\n  '#title': Email\n  '#required': true\nphone:\n  '#type': tel\n  '#title': Phone\n  '#required': true\norganization:\n  '#type': textfield\n  '#title': Organization\n  '#required': true\nshort_bio_list_of_accomplishments:\n  '#type': textarea\n  '#title': 'Short Bio / List of accomplishments'\n  '#required': true\ncontainer:\n  '#type': container\n  upload_file:\n    '#type': managed_file\n    '#title': 'Photo and Resumé of Nominee'\n    '#multiple': 2\n    '#description': '<div class=\"text-description\">Upload a maximum of two files on jpg, jpeg, png or pdf format no more than 2MB of weight for each.</div>'\n    '#help_display': element_after\n    '#required': true\n    '#file_placeholder': '<div class=\"text-description\">Upload a maximum of two files on jpg, jpeg, png or pdf format no more than 2MB of weight for each.</div>'\n    '#max_filesize': '2'\n    '#file_extensions': 'jpg jpeg png pdf'\n    '#sanitize': true\n    '#button': true\n    '#button__title': 'UPLOAD FILE'\n  actions:\n    '#type': webform_actions\n    '#title': 'Submit button(s)'\n    '#submit__label': SUBMIT"
