content:
  value: "<p>CONDICIONES DE RENOVACIÓN AUTOMÁTICA<br />\r\nEl plazo de su suscripción se detalla en el resumen de su pedido más arriba. Hoy se le cobrará el importe de su plazo inicial. Al final de cada período de suscripción, su suscripción se renovará automáticamente y se le cobrará la tarifa vigente en ese momento para cada período de suscripción.<br />\r\nLa fecha del pago de la renovación se confirmará en su correo electrónico de bienvenida. Si hay algún cambio en el importe y la frecuencia de su pago, AL DÍA News se lo notificará con al menos dos semanas de antelación. Puede cancelar su suscripción en cualquier momento enviando un correo electrónico a su centro local de atención al cliente. Por favor, espere hasta tres semanas para que su cancelación sea procesada.</p>\r\n"
  format: full_html
