register_admin_created:
  subject: 'An administrator created an account for you at [site:name]'
  body: "[user:display-name],\r\n\r\nA site administrator at [site:name] has created an account for you. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
register_no_approval_required:
  subject: 'Detalles de la cuenta para [user:display-name] en [site:name]'
  body: "[user:display-name],\r\n\r\n<img src=\"[site:url]themes/custom/al_dia_news/src/img/register1.png\">\r\n\r\n<h2>NOS ALEGRAMOS DE QUE HAYA DECIDIDO UNIRSE A ESTA FAMILIA LATINOAMERICANA.</h2>\r\n \r\n<div> \r\nSólo tiene que dar un paso más: Por favor, haga clic en el botón de abajo para confirmar su nueva cuenta.\r\n\r\nEn caso contrario, si no ha rellenado el formulario de registro para crear una cuenta, puede pasar por encima de este correo electrónico.\r\n\r\n\r\nLe damos la bienvenida a lo mejor de la experiencia latina en Estados Unidos.\r\n\r\nSaludos cordiales,\r\n</div>\r\n<div class=\"text-red\">\r\n  Martín Alfaro\r\n</div>\r\n<div>\r\n Bussiness Development Manager,\r\n</div>\r\nThank you for registering at [site:name]. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
register_pending_approval:
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
  body: "[user:display-name],\r\n\r\n<img src=\"[site:url]themes/custom/al_dia_news/src/img/register1.png\">\r\n\r\n<h2>WE ARE GLAD YOU HAVE DECIDED TO JOIN THIS LATINX AMERICAN FAMILY.ESPAÑOL</h2>\r\n\r\nYou just need to take one more step: Please, click the button below to confirm your new Account.\r\n\r\nOtherwise, if you did not fill the registration form for creating an Account, you can pass over this email.\r\n\r\n\r\nWe welcome you to the best of the American Latino Experience.\r\n\r\nBest Regards,\r\n\r\nMartín Alfaro\r\nBussiness Development Manager,\r\n<img src=\"[site:url]themes/custom/al_dia_news/src/img/logo.png\">\r\n\r\n\r\nThank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.\r\n\r\n--  [site:name] team"
register_pending_approval_admin:
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
  body: "[user:display-name] has applied for an account.\r\n\r\n[user:edit-url]"
status_activated:
  subject: 'Account details for [user:display-name] at [site:name]'
  body: "[user:display-name],\r\n\r\nYour account at [site:name] has been activated.\r\n\r\nYou may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:account-name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
status_blocked:
  subject: 'Account details for [user:display-name] at [site:name] (blocked)'
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\n--  [site:name] team"
status_canceled:
  subject: 'Account details for [user:display-name] at [site:name] (canceled)'
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
