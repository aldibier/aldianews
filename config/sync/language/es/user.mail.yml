em;color: #036BCB;word-break: break-all;\">\r\n                                                    [user:cancel-url] </p>\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                     <!--spacer-->\r\n                                     <table>\r\n                                        <tr align=\"center\">\r\n                                            <td>\r\n                                                <img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\"\r\n                                                    width=\"100%\" height=\"15\" />\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                    <!--end spacer-->\r\n                                    <table border=\"0\" cellspacing=\"0\" cellpadding=\"0\" align=\"center\"\r\n                                    style=\"margin: 0; line-height: 0\">\r\n                                        <tr>\r\n                                            <td>\r\n                                                <p style=\"margin:0 ;font-style: normal;font-weight: normal;font-size: 14px;line-height: 1.5;letter-spacing: 0.03em;color: #333333;\">\r\n                                                    NOTA: La cancelación de su cuenta no es reversible.</p>\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                     <!--spacer-->\r\n                                     <table>\r\n                                        <tr align=\"center\">\r\n                                            <td>\r\n                                                <img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\"\r\n                                                    width=\"100%\" height=\"15\" />\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                    <!--end spacer-->\r\n                                    <table border=\"0\" cellspacing=\"0\" cellpadding=\"0\" align=\"center\"\r\n                                    style=\"margin: 0; line-height: 0\">\r\n                                        <tr>\r\n                                            <td>\r\n                                                <p style=\"margin:0 ;font-style: normal;font-weight: normal;font-size: 14px;line-height: 1.5;letter-spacing: 0.03em;color: #333333;\">\r\n                                                    Este enlace caduca en un día y no pasará nada si no se\r\n                                                    no se utiliza.</p>\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                     <!--spacer-->\r\n                                     <table>\r\n                                        <tr align=\"center\">\r\n                                            <td>\r\n                                                <img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\"\r\n                                                    width=\"100%\" height=\"15\" />\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                    <!--end spacer-->\r\n                                    <table border=\"0\" cellspacing=\"0\" cellpadding=\"0\" align=\"center\"\r\n                                    style=\"margin: 0; line-height: 0\">\r\n                                        <tr>\r\n                                            <td>\r\n                                                <p style=\"margin:0 ;font-style: normal;font-weight: normal;font-size: 14px;line-height: 1.5;letter-spacing: 0.03em;color: #333333;\">\r\n                                                    -- [site:name] team</p>\r\n                                            </td>\r\n                                        </tr>\r\n                                    </table>\r\n                                </td>\r\n                                  <!--spacer-->\r\n                                <td width=\"30\">\r\n                                    <img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\" width=\"100%\" />\r\n                                </td>\r\n                                <!--end spacer-->\r\n                            </tr>\r\n                        </table>\r\n                        <!--end container main-->\r\n                        <!--spacer-->\r\n                        <table border=\"0\" cellspacing=\"0\" cellpadding=\"0\" align=\"center\"\r\n                            style=\"margin: 0 auto; line-height: 0\">\r\n                            <tr align=\"center\">\r\n                                <td>\r\n                                    <img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\" width=\"100%\"\r\n                                        height=\"30\" />\r\n                                </td>\r\n                            </tr>\r\n                        </table>\r\n                        <!--end spacer-->\r\n                    </td>\r\n                    <!--dropshadow right-->\r\n                    <td width=\"1\" bgcolor=\"#b3b3b3\" style=\"padding: 0;\"><img\r\n                            src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\" width=\"1\"\r\n                            style=\"display: block;\" /></td>\r\n                    <td width=\"1\" bgcolor=\"#d1d1d1\"><img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\"\r\n                            width=\"1\" style=\"display: block;\" /></td>\r\n                    <td width=\"1\" bgcolor=\"#e8e8e8\"><img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\"\r\n                            width=\"1\" style=\"display: block;\" /></td>\r\n                    <td width=\"1\" bgcolor=\"#ffffff\"><img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\"\r\n                            width=\"1\" style=\"display: block;\" /></td>\r\n                    <!--end dropshadow right-->\r\n                </tr>\r\n            </table>\r\n            <table width=\"600\" cellspacing=\"0\" cellpadding=\"0\" align=\"center\"\r\n                style=\"width: 100%;max-width: 600px;margin: 0 auto;border-collapse: collapse;\">\r\n                <!-- Drop Shadow Bottom -->\r\n                <tr>\r\n                    <!--spacer-->\r\n                    <td width=\"2.5\" style=\"padding: 0;\">\r\n                        <img src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\" width=\"100%\"\r\n                            style=\"display: block;\" />\r\n                    </td>\r\n                    <!--end spacer-->\r\n                    <td align=\"center\" bgcolor=\"#ffffff\">\r\n                        <table width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" align=\"center\"\r\n                            style=\"width: 100%;max-width: 600px;margin: 0 auto;border-collapse: collapse;\">\r\n                            <tr>\r\n                                <td width=\"1\" bgcolor=\"#d1d1d1\"><img\r\n                                        src=\"[site:url]themes/custom/al_dia_news/src/img/spacer.gif\" width=\"1\"\r\n                                        style=\"display: block;\" />\r\n                                </td>\r\n                            </tr>\r\n                            <tr>\r\n                                <td width=\"1\" bgcolor=\"#d1d1d1\"><img\r\n                          