global:
  version: VERSION
  css:
    theme:
      assets/css/styles.css: {}
      assets/css/icon.css: {}
      assets/libraries/css/font-awesome/css/all.min.css: {}
  js:
    https://imasdk.googleapis.com/js/sdkloader/ima3.js: { type: external, minified: true }
    assets/js/scripts.js: { minified: true, attributes: { defer: true } }
    assets/libraries/browserclass.js: {}
  dependencies:
    - core/jquery
    - core/drupalSettings
    - core/once
    - al_dia_news/slick
    - al_dia_news/sumoselect
    - al_dia_news/scrollmagic

scrollmagic:
  version: 2.0.7
  js:
    assets/libraries/scrollmagic/minified/ScrollMagic.min.js: {}
    #assets/libraries/scrollmagic/uncompressed/plugins/debug.addIndicators.js: {}

slick:
  version: 1.8.1
  js:
    assets/libraries/slick/js/slick.min.js: {}
  css:
    theme:
      assets/libraries/slick/css/slick.css: {}
      assets/libraries/slick/css/banner-slick-track.css: {}

sumoselect:
  version: 3.0.2
  js:
    assets/libraries/sumoselect/minified/jquery.sumoselect.min.js: {}
  css:
    theme:
      assets/libraries/sumoselect/uncompressed/sumoselect.css: {}
