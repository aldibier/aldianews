al_dia_local_geo.settings:
  type: config_object
  label: 'Local geo settings'
  mapping:
    default_tid:
      type: integer
      label: 'Fallback category term ID'
    zones:
      type: sequence
      label: 'Zones'
      sequence:
        type: mapping
        mapping:
          label:
            type: string
            label: 'Label'
          tid:
            type: integer
            label: 'Category term ID'
          enabled:
            type: boolean
            label: 'Enabled'
          postal_codes:
            type: sequence
            label: 'ZIP codes'
            sequence:
              type: string
