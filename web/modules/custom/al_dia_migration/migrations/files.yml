id: files
label: Public files

migration_tags:
  - Drupal 7
  - File

migration_group: d7

source:
  plugin: d7_file
  scheme: public
  constants:
    source_base_path: 'https://aldianews.com'
  key: migrate

process:
  fid: fid
  filename: filename
  source_full_path:
    -
      plugin: concat
      delimiter: /
      source:
        #- constants/source_base_path
        - filepath
    -
      plugin: urlencode
  uri:
    plugin: default_value
    #plugin: file_copy
    source:
      - '@source_full_path'
      - uri
  filemime: filemime
  status: status

  created: timestamp
  changed: timestamp
  uid: uid

destination:
  plugin: entity:file
