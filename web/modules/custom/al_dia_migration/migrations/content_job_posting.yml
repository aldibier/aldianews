id: content_job_posting
label: job_posting
migration_group: content

source:
 plugin: d7_node
 node_type: job_posting
 key: migrate

process:
  title: title

  field_requirements/value:
    plugin: extract
    source: body
    default: ''
    index: 
      - 0
      - value
  field_requirements/format: 
    plugin: default_value
    default_value: full_html

  body/value:
    plugin: extract
    source: body
    default: ''
    index: 
      - 0
      - summary

  body/format: 
    plugin: default_value
    default_value: full_html

  field_link_to_apply_for_the_job:
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: extract
      source: field_link_to_apply
      defaul: ''
      index:
        - 0
        - url

  field_place: 
    plugin: concat    
    source: 
      - field_job_location/0/country
      - field_job_location/0/locality
      #- field_job_location/0/thoroughfare
    delimiter: ', '

  field_expiration_date: 
    plugin: default_value
    default_value: "2022-01-30"
  
