id: content_thought_leaders_i18n
label: thought_leaders_i18n
migration_group: content

source:
  plugin: d7_node
  node_type: article
  translations: true
  key: migrate

process:  
  content_translation_source: source_langcode
  nid:
    plugin: migration_lookup
    source: tnid
    migration: content_thought_leaders
  langcode: language

  title: title

  field_short_title_thounght:
    plugin: headline
    source: title

  field_image:
    plugin: sub_process
    source: field_image
    process:
      target_id:
        plugin: migration_lookup
        migration: files
        source: fid
        no_stub: true
      alt: alt
  field_video:
    plugin: extract
    source: field_video
    default: ''
    index:
      - 0
      - video_url

  field_caption:
    -
      plugin: callback
      callable: strip_tags
      source: field_media_caption/0/value
    -
      plugin: leadcaption

  body/value:
    plugin: fix_media_tags
    source: body/0/value
   
  body/summary:
    plugin: leadsummary
    source: body/0/summary
    
  body/format:
    plugin: default_value
    default_value: full_html

 
  field_tags:
    plugin: migration_lookup
    migration: taxonomy_tags
    source: field_author_tags


  uid:
    plugin: ignore_rol
    migration: users
    source: node_uid
  
  created: created
  status: status
  changed: changed

destination:
  plugin: 'entity:node'
  translations: true

migration_dependencies:
  required: 
    - taxonomy_tags
    - files
    - users
