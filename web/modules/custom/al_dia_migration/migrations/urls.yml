id: urls
label: URL aliases
migration_group: content
migration_tags:
  - Drupal 7
  - Content

source:
  plugin: urls_redirect
  constants:
    prefix: node

process:

  _nid:
    -
      plugin: migration_lookup
      source: nid
      migration:
        - content_job_posting
        - content_print_edition
        - content_event
        - content_event_i18n        
        - content_article
        - content_article_i18n
      no_stub: true
    -
      plugin: skip_on_empty
      method: row

  _redirect:
    plugin: concat
    source:
      - constants/prefix
      - '@_nid'
    delimiter: /

  uid:
    plugin: default_value
    default_value: 1

  language:
    plugin: default_value
    source: language
    default_value: und

  status_code:
    plugin: default_value
    default_value: 301

  redirect_source/path: alias
  
  redirect_redirect/uri:
    plugin: d7_path_redirect
    source:
      - '@_redirect'

destination:
  plugin: entity:redirect

migration_dependencies:
  required:
    - content_job_posting
    - content_print_edition
    - content_event
    - content_event_i18n        
    - content_article
    - content_article_i18n
